spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eventuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eventpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Mail Configuration — no literal credentials here, ever. Both SPRING_MAIL_USERNAME and
# SPRING_MAIL_PASSWORD (a Gmail App Password, not the account password) must be set as real
# env vars on Render. Previous versions of this file hardcoded a live Gmail App Password in
# plaintext — that password (and the other one that was in render.yaml) must be treated as
# compromised and rotated in Google Account settings, since git history can't be un-leaked.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# Security Configuration — no insecure default. If ADMIN_TOKEN isn't set, Spring fails to
# start rather than silently falling back to a value that was hardcoded in this file's git
# history (and is therefore public). Set a freshly generated, random ADMIN_TOKEN on Render —
# the previous default AND the token that leaked via frontend/.env.local must both be treated
# as compromised.
app.admin.token=${ADMIN_TOKEN}
