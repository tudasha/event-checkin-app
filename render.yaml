services:
  - type: web
    name: event-backend
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DB_URL
        fromDatabase:
          name: event-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: event-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: event-db
          property: password
      # sync: false — value is set directly in the Render dashboard, never stored in git.
      # Previous versions of this file hardcoded a real Gmail App Password here in plaintext;
      # that password (for tudasherxd@gmail.com) must be treated as compromised and rotated.
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      # Was missing entirely before, meaning production ran on application.properties'
      # hardcoded fallback token. Set a freshly generated random value in the dashboard.
      - key: ADMIN_TOKEN
        sync: false

databases:
  - name: event-db
    databaseName: eventdb
    user: eventuser
    plan: free
